<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160">
  <!--
    The logo for the smallest sizes, such as the notification area: the same hand, larger
    in its tile and with thicker fingers, so that it survives being 16 pixels wide.
  -->
  <defs>
    <clipPath id="tile">
      <rect width="160" height="160" rx="32"/>
    </clipPath>
  </defs>
  <rect width="160" height="160" rx="32" fill="#5b5fc7"/>
  <g clip-path="url(#tile)">
    <g transform="translate(-4 -8) rotate(-38 80 80) translate(80 80) scale(1.22) translate(-80 -84)" fill="#ffffff">
      <path d="M58 -70 L102 -70 L100 56 L60 56 Z"/>
      <rect x="46" y="36" width="68" height="58" rx="24"/>
      <rect x="46" y="66" width="15.5" height="50" rx="7.75" transform="rotate(7 54 70)"/>
      <rect x="63.5" y="70" width="15.5" height="58" rx="7.75" transform="rotate(2.5 71 74)"/>
      <rect x="81" y="70" width="15.5" height="62" rx="7.75" transform="rotate(-1.5 89 74)"/>
      <rect x="98.5" y="66" width="15.5" height="54" rx="7.75" transform="rotate(-6 106 70)"/>
      <rect x="103" y="52" width="18" height="46" rx="9" transform="rotate(-42 112 60)"/>
    </g>
  </g>
</svg>
